<div class="flex flex-row gap-2">
  @for (button of buttons; track button) {
    <button (click)="buttonClicked(button)"
            [disabled]="getIsDisabled(button)"
            [title]="button.toLocaleUpperCase()"
            aria-label="execution control button"
            class="execution-btn"
            [ngClass]="getButtonColorClass(button)">
      <span class="material-icons">{{ getIcon(button) }}</span>
      @if (button === 'start' && !isAssembled) {
        <span
          class="material-icons execution-build-indicator">construction</span>

      }
    </button>
  }


</div>
