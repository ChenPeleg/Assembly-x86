@if (memory !== null) {
  <div class="memory max-w-[28vw] max-sm:w-[98vw] max-sm:max-w-[99vw]">
    @for (row of createRange(getRowCount()); track row) {
      <span class="row flex flex-wrap m-0 max-sm:inline-flex">
        @for (col of createRange(width); track col) {
          <span class="col inline relative">
            @if (memory?.isValid(createAddress(row, col))) {
              <span (click)="clickCell(row, col)"
                [title]="'Address:' + createAddress(row, col) + ' Value:' +  getCellValue(createAddress(row, col))" class="relative bottom-0 inline-block min-w-[30px] h-[17px] m-0.5 p-[3px] text-[11px] leading-none border border-[#3b3b3b] text-black rounded-[3px] text-center cursor-pointer"
                >
                {{ getCellValue(createAddress(row, col)) || '&nbsp;' }}
              </span>
            }
          </span>
        }
        <span class="w-1 h-5  border-r-black  border-r-2 " id="row-end">  </span>
      </span>
    }
  </div>
}
